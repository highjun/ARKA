# 로컬 PC 한 대에 ADE 컨테이너 하나. 바깥에서 오는 길은 cloudflared Tunnel뿐이다(→ ADR 0014).
#
# 빌드 컨텍스트는 **리포 루트**다 — 이미지 하나에 클라이언트 정적 파일과 서버 번들이 함께
# 들어가므로(`dist/` 하나가 배포 단위, → ADR 0013) 세 패키지의 package.json이 다 필요하다.
# 파일만 여기 모아 두고 컨텍스트는 위를 가리킨다. `docker compose -f ops/deploy/compose.yml up`.
#
# **이 파일이 바탕이다** — CI(`.env.ci`)와 PR 미리보기와 실배포가 전부 여기에 override를 얹는다.
services:
  ade:
    build:
      context: ../..
      dockerfile: ops/deploy/Dockerfile
    image: ade:local
    # 호스트 루프백에만 연다 — 같은 LAN의 다른 기기가 직접 붙을 수 없다. Tunnel이 이 포트에 붙는다.
    ports:
      - "127.0.0.1:${ADE_PORT:-3000}:3000"
    # 가장 흔한 버그가 볼륨 UID/GID 불일치다 — 호스트 사용자로 돈다.
    #
    # **`UID`가 아니라 `ADE_UID`인 이유**: bash에서 `UID`는 읽기 전용이라
    # `UID=$(id -u) docker compose up`이 대입에서 죽는다(2026-09-10 실측). 이름을 피한다.
    #
    #     ADE_UID=$(id -u) ADE_GID=$(id -g) docker compose -f ops/deploy/compose.yml up -d --build
    user: "${ADE_UID:-1000}:${ADE_GID:-1000}"
    # **목록 문법인 이유**: 이름만 적으면 변수가 없을 때 컨테이너에 아예 만들어지지 않는다.
    # `KEY: "${KEY:-}"`로 쓰면 **빈 문자열**이 들어가는데, 서버 스키마가 `min(1)`이라
    # "없음"이 아니라 "너무 짧음"으로 읽혀 부팅에서 죽고 재시작 루프에 빠진다(2026-09-10 실측).
    environment:
      # **켜는 것은 이 스위치고 키가 아니다**(→ ADR 0007). 비우면 스크립트 실행기.
      # `anthropic`으로 켜 놓고 키가 없으면 부팅에서 죽는다 — 조용히 꺼진 채 뜨지 않는다.
      - ADE_AGENT_RUNNER=${ADE_AGENT_RUNNER:-scripted}
      # 값은 .env에 두고 리포에 넣지 않는다.
      - ADE_ANTHROPIC_API_KEY
      - ADE_ANTHROPIC_MODEL=${ADE_ANTHROPIC_MODEL:-claude-opus-5}
    volumes:
      - "${ADE_WORKSPACE:-./workspace}:/workspace"
      # 세션·이벤트 로그(SQLite). 백업은 이 볼륨의 data.db 파일 복사다.
      - ade-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

volumes:
  ade-data:
