# ARKA 하나를 사용자 PC에 띄운다. 바깥에서 오는 길은 cloudflared Tunnel뿐이다(→ ADR 0006).
#
# **이 파일 하나가 로컬·CI·실배포를 다 든다.** 예전에는 실배포만 `render.ts`가 만든 다른 파일로
# 떴고 CI는 이 파일을 검사했다 — 검사하는 것과 뜨는 것이 다른 파일이었다.
#
#     docker compose -f ops/deploy/compose.yml up -d --build --wait           로컬·CI
#     docker compose -f ops/deploy/compose.yml --profile tunnel up -d --wait   실배포
#
# 빌드 컨텍스트는 **리포 루트**다 — 이미지 하나에 클라이언트 정적 파일과 서버 번들이 함께 들어간다.
name: ${ARKA_NAME:-arka}

services:
  app:
    build:
      context: ../..
      dockerfile: ops/deploy/Dockerfile
    image: ${ARKA_IMAGE:-arka:local}
    container_name: ${ARKA_NAME:-arka}-app
    restart: unless-stopped
    # 가장 흔한 버그가 볼륨 UID/GID 불일치다 — 호스트 사용자로 돈다.
    #
    # **`UID`가 아니라 `ARKA_UID`인 이유**: bash에서 `UID`는 읽기 전용이라
    # `UID=$(id -u) docker compose up`이 대입에서 죽는다(2026-09-10 실측). 이름을 피한다.
    user: "${ARKA_UID:-1000}:${ARKA_GID:-1000}"
    volumes:
      # **실재하는 디렉터리여야 한다** — 없으면 부팅에서 죽고, docker가 대신 만들면 root 소유가 된다.
      - "${ARKA_WORKSPACE:-./workspace}:/workspace"
    # **로그가 무제한으로 자라지 않게 한다.** docker 기본값은 회전이 없어 json 파일이 디스크를
    # 다 먹을 때까지 늘어난다. 10MB × 3개면 사고를 짚기에 충분하고 상한이 30MB다.
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

  tunnel:
    # **실배포에서만 뜬다.** 로컬·CI는 터널 없이도 "이미지가 뜨는가"를 볼 수 있다.
    profiles: [tunnel]
    image: cloudflare/cloudflared:latest
    container_name: ${ARKA_NAME:-arka}-tunnel
    restart: unless-stopped
    # 자격증명 파일이 0600이라 **호스트 사용자로 돌아야 읽는다.** 이미지 기본 사용자로 두면
    # 권한 오류로 붙지 못한다.
    user: "${ARKA_UID:-1000}:${ARKA_GID:-1000}"
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    # **터널 설정과 자격증명이 저장소에 없다**(→ ADR 0006). 저장소가 공개라 호스트 이름과
    # 터널 ID가 드러나면 안 되고, 그 둘은 배포마다 바뀌는 값도 아니다. 손으로 쓴 파일이
    # 이 기계의 `~/ARKA/secure/`에 살고 여기서는 **경로만** 값으로 받는다.
    # 예전에는 `render.ts`가 배포마다 이 설정을 만들었다 — 그 2,500줄이 이 두 줄이 됐다.
    volumes:
      - "${ARKA_TUNNEL_CONFIG:-./tunnel-config-이-없습니다.yml}:/etc/cloudflared/config.yml:ro"
      - "${ARKA_TUNNEL_CREDENTIALS:-./tunnel-creds-가-없습니다.json}:/etc/cloudflared/creds.json:ro"
    # **로그가 무제한으로 자라지 않게 한다.** docker 기본값은 회전이 없어 json 파일이 디스크를
    # 다 먹을 때까지 늘어난다. 10MB × 3개면 사고를 짚기에 충분하고 상한이 30MB다.
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    # 앱이 healthy가 된 뒤에 붙는다 — 그 전에 붙으면 502가 밖으로 나간다.
    depends_on:
      app:
        condition: service_healthy
