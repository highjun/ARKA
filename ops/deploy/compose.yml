name: ${ARKA_NAME}

services:
  app:
    build:
      context: ../..
      dockerfile: ops/deploy/Dockerfile
    image: ${ARKA_IMAGE}
    container_name: ${ARKA_NAME}-app
    restart: unless-stopped
    user: "${ARKA_UID}:${ARKA_GID}"
    environment:
      NODE_ENV: ${ARKA_NODE_ENV}
      ARKA_HOST: ${ARKA_CONTAINER_HOST}
      ARKA_PORT: ${ARKA_CONTAINER_PORT}
      ARKA_WORKSPACE: ${ARKA_CONTAINER_WORKSPACE}
      ARKA_CLIENT_ROOT: ${ARKA_CLIENT_ROOT}
      ARKA_GIT_SHA: ${ARKA_GIT_SHA}
    ports:
      - "${ARKA_PUBLISH}:${ARKA_CONTAINER_PORT}"
    volumes:
      - "${ARKA_WORKSPACE}:${ARKA_CONTAINER_WORKSPACE}"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${ARKA_CONTAINER_PORT}/api/health"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

  tunnel:
    profiles: [tunnel]
    image: cloudflare/cloudflared:latest
    container_name: ${ARKA_NAME}-tunnel
    restart: unless-stopped
    user: "${ARKA_UID}:${ARKA_GID}"
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - "${ARKA_TUNNEL_CONFIG}:/etc/cloudflared/config.yml:ro"
      - "${ARKA_TUNNEL_CREDENTIALS}:/etc/cloudflared/creds.json:ro"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    depends_on:
      app:
        condition: service_healthy
