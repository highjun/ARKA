name: ${ARKA_NAME:-arka}

services:
  app:
    build:
      context: ../..
      dockerfile: ops/deploy/Dockerfile
    image: ${ARKA_IMAGE:-arka:local}
    container_name: ${ARKA_NAME:-arka}-app
    restart: unless-stopped
    user: "${ARKA_UID:-1000}:${ARKA_GID:-1000}"
    volumes:
      - "${ARKA_WORKSPACE:-./workspace}:/workspace"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

  tunnel:
    profiles: [tunnel]
    image: cloudflare/cloudflared:latest
    container_name: ${ARKA_NAME:-arka}-tunnel
    restart: unless-stopped
    user: "${ARKA_UID:-1000}:${ARKA_GID:-1000}"
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - "${ARKA_TUNNEL_CONFIG:-./tunnel-config-이-없습니다.yml}:/etc/cloudflared/config.yml:ro"
      - "${ARKA_TUNNEL_CREDENTIALS:-./tunnel-creds-가-없습니다.json}:/etc/cloudflared/creds.json:ro"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    depends_on:
      app:
        condition: service_healthy
