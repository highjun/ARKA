# 로컬 PC 한 대에 ADE 컨테이너 하나. 바깥에서 오는 길은 cloudflared Tunnel뿐이다(→ ADR 0014).
#
# 빌드 컨텍스트는 **리포 루트**다 — 이미지 하나에 클라이언트 정적 파일과 서버 번들이 함께
# 들어가므로(`dist/` 하나가 배포 단위, → ADR 0013) 세 패키지의 package.json이 다 필요하다.
# 파일만 여기 모아 두고 컨텍스트는 위를 가리킨다. `docker compose -f deploy/docker-compose.yml up`.
services:
  ade:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: ade:local
    # 호스트 루프백에만 연다 — 같은 LAN의 다른 기기가 직접 붙을 수 없다. Tunnel이 이 포트에 붙는다.
    ports:
      - "127.0.0.1:${ADE_PORT:-3000}:3000"
    # 가장 흔한 버그가 볼륨 UID/GID 불일치다 — 호스트 사용자로 돈다. `UID=$(id -u) GID=$(id -g) docker compose up`.
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      # 있으면 실제 LLM 실행기, 없으면 스크립트 실행기(ADR 0019). 값은 .env에 두고 리포에 넣지 않는다.
      ADE_ANTHROPIC_API_KEY: "${ADE_ANTHROPIC_API_KEY:-}"
      ADE_ANTHROPIC_MODEL: "${ADE_ANTHROPIC_MODEL:-claude-opus-5}"
    volumes:
      - "${ADE_WORKSPACE:-./workspace}:/workspace"
      # 세션·이벤트 로그(SQLite). 백업은 이 볼륨의 data.db 파일 복사다.
      - ade-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

volumes:
  ade-data:
