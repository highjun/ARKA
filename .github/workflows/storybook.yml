name: Storybook

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: storybook-pages
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  publish:
    name: storybook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 어디에 올릴지 정한다
        id: where
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "dir=pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          else
            echo "dir=." >> "$GITHUB_OUTPUT"
          fi

      - uses: ./.github/actions/setup
        if: github.event.action != 'closed'
      - name: 스토리북을 굽는다
        if: github.event.action != 'closed'
        run: pnpm --filter client run build:storybook

      - name: gh-pages에 올린다
        env:
          DIR: ${{ steps.where.outputs.dir }}
          CLOSED: ${{ github.event.action == 'closed' }}
        run: |
          SRC="$PWD/packages/client/.output/storybook-static"
          git clone --depth 1 --branch gh-pages \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" /tmp/pages 2>/dev/null || {
            mkdir -p /tmp/pages && cd /tmp/pages && git init -q && git checkout -q -b gh-pages
            git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          }
          cd /tmp/pages
          touch .nojekyll
          if [ "$CLOSED" = "true" ]; then
            rm -rf "./$DIR"
          elif [ "$DIR" = "." ]; then
            find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .nojekyll ! -name 'pr-*' -exec rm -rf {} +
            cp -r "$SRC/." ./
          else
            rm -rf "./$DIR" && mkdir -p "./$DIR" && cp -r "$SRC/." "./$DIR/"
          fi
          if [ "$CLOSED" != "true" ] && [ ! -f "./$DIR/index.html" ]; then
            echo "::error::스토리북이 복사되지 않았습니다 — $DIR/index.html이 없습니다"; exit 1
          fi
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "바뀐 것이 없습니다"; exit 0; }
          git commit -q -m "storybook: ${{ github.event_name }} ${{ github.sha }}"
          git push -q origin gh-pages

      - name: PR에 링크를 남긴다
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const closed = context.payload.action === 'closed';
            const dir = `pr-${context.payload.pull_request.number}`;
            const url = `https://${context.repo.owner}.github.io/${context.repo.repo}/${dir}/`;
            const body = [
              '<!-- arka-storybook -->',
              `### 스토리북 — ${closed ? '내렸습니다' : '올라갔습니다'}`,
              closed ? '이 PR의 스토리북을 지웠습니다.' : url,
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const list = await github.rest.issues.listComments({ owner, repo, issue_number });
            const mine = list.data.find((c) => c.body?.includes('<!-- arka-storybook -->'));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
