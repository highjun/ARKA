# 병합 전 관문(→ ADR 0005). **로컬의 `pnpm --filter ops check`와 같은 것을 돌린다** —
# CI에만 있는 검사를 만들면 로컬이 초록인데 CI가 빨간 상태를 아무도 재현하지 못한다.
#
# 잡 이름(`check`·`container`·`pr-title`)은 브랜치 보호의 필수 체크로 등록되므로 바꾸지 않는다.
name: CI

on:
  push:
    branches: [main]
  # `edited`는 제목을 고쳤을 때 pr-title을 다시 돌리려고 넣었다. 무거운 잡은 아래에서 건너뛴다.
  pull_request:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ci-${{ github.ref }}
  # **`main` push는 취소하지 않는다.** 런이 통째로 취소되면 `deploy`까지 죽어 그 커밋이 배포되지 않는다
  # (2026-09-11 #20·#21 실측). PR은 새 push가 오면 앞 런이 무의미하므로 취소한다.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# 기본은 읽기만. 더 필요한 잡이 자기 자리에서 더한다.
permissions:
  contents: read

jobs:
  check:
    name: check
    # 제목만 고친 경우 코드가 그대로라 다시 돌릴 것이 없다.
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # 순서에 이유가 있다 — 싼 것부터 돌려야 원인이 가려지지 않는다(→ ops/pipeline/check.ts).
      #
      # **`--if-present`가 없으면 모든 PR이 빨간불이다**: contracts와 ops에는 `build`가 없어
      # pnpm이 `ERR_PNPM_RECURSIVE_RUN_NO_SCRIPT`로 exit 1을 낸다(2026-09-10 실측).
      - run: pnpm -r --if-present run lint
      - run: pnpm -r --if-present run typecheck
      - run: pnpm -r --if-present run test
      - run: pnpm -r --if-present run build

  container:
    name: container
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # **워크스페이스가 실재해야 부팅한다** — 없으면 config가 던지고 프로세스가 죽는다.
      # docker가 대신 만들게 두면 root 소유가 되어 컨테이너가 쓰지 못한다.
      - run: mkdir -p /tmp/ade-ci-workspace
      # `--wait`는 compose의 HEALTHCHECK(`/api/health`)가 통과할 때까지 기다린다.
      # "빌드는 되는데 뜨지 않는다"를 병합 전에 잡는 것이 이 잡의 전부다.
      # **프로젝트 이름은 `.env.ci`의 `ADE_NAME`이 정한다**(`ci`) — `-p`로 또 적으면 두 곳이 갈린다.
      # 터널은 `--profile tunnel` 없이는 뜨지 않는다. CI에는 토큰이 없고 필요도 없다.
      - name: 컨테이너를 띄운다
        run: |
          ADE_UID=$(id -u) ADE_GID=$(id -g) docker compose \
            -f ops/deploy/compose.yml --env-file ops/deploy/.env.ci \
            up -d --build --wait
      - name: 실패하면 로그를 남긴다
        if: failure()
        run: docker compose -f ops/deploy/compose.yml --env-file ops/deploy/.env.ci logs
      - name: 정리
        if: always()
        run: docker compose -f ops/deploy/compose.yml --env-file ops/deploy/.env.ci down -v

  e2e:
    name: e2e
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # 스펙이 `projects`를 선언하지 않아 기본 chromium으로 돈다. 그것만 받는다.
      - run: pnpm --filter client exec playwright install --with-deps chromium
      # webServer가 스스로 client를 빌드하고 server를 tsx로 띄운다(playwright.config.ts).
      - run: pnpm --filter client run test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: packages/client/.output/playwright/
          retention-days: 7

  pr-title:
    name: pr-title
    # squash merge라 **PR 제목이 그대로 main의 커밋 메시지가 된다.** 개별 커밋이 아니라 이것을 본다.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # 제목을 인자가 아니라 env로 넘긴다 — 제목에 든 따옴표·백틱이 셸에 해석되지 않게.
      - run: printf '%s' "$PR_TITLE" | pnpm --filter ops exec commitlint
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}

  deploy:
    name: deploy
    # **검사가 통과한 뒤에만 배포한다.** `needs`만이 워크플로 안에서 그것을 보장한다 —
    # 파일을 갈라 `workflow_run`으로 엮으면 체크아웃 ref를 손으로 맞춰야 한다.
    needs: [check, container, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, arka]
    concurrency:
      group: deploy-production
      # **배포는 중간에 자르지 않는다.** 컨테이너를 바꾸는 중에 끊기면 무엇이 떠 있는지 모른다.
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      # 되돌릴 자리를 먼저 만든다. 지금 떠 있는 이미지에 이름을 붙여 둔다.
      - name: 되돌릴 이미지를 표시한다
        run: docker image tag ade:latest ade:previous 2>/dev/null || echo "첫 배포 — 되돌릴 것이 없습니다"

      - name: 이미지를 만든다
        run: node ops/deploy/build.ts ade:latest

      # 값은 **이 기계의 파일**에 있다(0600) — GitHub Secrets에 두지 않는다. `set -a`로 셸에 풀어
      # compose의 치환(`${ADE_*}`)과 `environment:` 통과에 둘 다 닿게 한다.
      # 터널·인그레스·DNS는 Cloudflare 대시보드가 들고, 여기 필요한 것은 커넥터 토큰뿐이다.
      - name: 올린다
        run: |
          set -a; . "$HOME/ARKA/secure/env/ade.env"; set +a
          docker compose -f ops/deploy/compose.yml --profile tunnel up -d --no-build --wait

      # **이 검사가 실질적인 자물쇠다.** ADE에는 인증이 없고 워크스페이스가 사용자의 개인
      # 디렉터리라, Access가 살아 있지 않으면 그 전체가 인터넷에 열린다.
      - name: 익명 접근이 막히는지 본다
        run: node ops/deploy/anonSmoke.ts https://arka.sangjun.dev

      - name: 실패하면 로그와 되돌리는 법을 남긴다
        if: failure()
        run: |
          docker logs --tail 100 ade-app || true
          echo "::error::되돌리려면 docs/operations.md의 '되돌리기' — 이미지를 ade:previous로 되돌리고 같은 compose 명령을 다시 돌립니다"

  secrets:
    name: secrets
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks가 커밋 범위를 훑으려면 이력이 있어야 한다.
          fetch-depth: 0
      # 액션이 아니라 이미지를 직접 쓴다 — 로컬에서 같은 명령으로 재현되고, 조직 라이선스
      # 안내를 지나지 않아도 된다. `--redact`로 값이 로그에 남지 않게 한다.
      - name: 이번에 더해진 커밋을 훑는다
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            RANGE="${{ github.event.before }}..${{ github.sha }}"
          fi
          echo "범위=$RANGE"
          docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.30.1 \
            git /repo --gitleaks-ignore-path /repo/ops/.gitleaksignore \
            --log-opts="--no-merges $RANGE" --redact --no-banner
