# 병합 전 관문(→ ADR 0005). **로컬에서 부를 수 있는 명령만 부른다** —
# CI에만 있는 검사를 만들면 로컬이 초록인데 CI가 빨간 상태를 아무도 재현하지 못한다.
#
# 잡은 둘이다. `check`는 룰셋의 **필수 검사 이름**이라 바꾸지 않는다.
name: CI

on:
  push:
    branches: [main]
  # **`edited`를 받지 않는다.** PR 본문·제목을 고치면 이벤트가 하나 더 나고, 아래 concurrency가
  # 돌던 진짜 검사를 취소한 뒤 그 자리를 대신한다 — 관문이 조용히 비었다(2026-09-13 실측).
  # 제목을 고쳤으면 push하거나 PR을 닫았다 열어 다시 돌린다.
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ci-${{ github.ref }}
  # **`main` push는 취소하지 않는다.** 런이 통째로 취소되면 `deploy`까지 죽어 그 커밋이 배포되지 않는다
  # (2026-09-11 #20·#21 실측). PR은 새 push가 오면 앞 런이 무의미하므로 취소한다.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# 기본은 읽기만. 더 필요한 잡이 자기 자리에서 더한다.
permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks가 커밋 범위를 훑으려면 이력이 있어야 한다.
          fetch-depth: 0
      - uses: ./.github/actions/setup

      # 순서에 이유가 있다 — **싼 것부터** 돌려야 원인이 가려지지 않는다.
      #
      # **`--if-present`가 없으면 모든 PR이 빨간불이다**: contracts와 ops에는 `build`가 없어
      # pnpm이 `ERR_PNPM_RECURSIVE_RUN_NO_SCRIPT`로 exit 1을 낸다(2026-09-10 실측).
      - run: pnpm -r --if-present run lint
      - run: pnpm -r --if-present run typecheck
      - run: pnpm -r --if-present run test
      - run: pnpm -r --if-present run build

      # squash merge라 **PR 제목이 그대로 main의 커밋 메시지가 된다.** 개별 커밋이 아니라 이것을 본다.
      # 제목을 인자가 아니라 env로 넘긴다 — 제목에 든 따옴표·백틱이 셸에 해석되지 않게.
      - name: PR 제목 형식
        if: github.event_name == 'pull_request'
        run: printf '%s' "$PR_TITLE" | pnpm --filter ops exec commitlint
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}

      # 액션이 아니라 이미지를 직접 쓴다 — 로컬에서 같은 명령으로 재현되고, 조직 라이선스
      # 안내를 지나지 않아도 된다. `--redact`로 값이 로그에 남지 않게 한다.
      - name: 이번에 더해진 커밋에 시크릿이 있나
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            RANGE="${{ github.event.before }}..${{ github.sha }}"
          fi
          echo "범위=$RANGE"
          docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.30.1 \
            git /repo --gitleaks-ignore-path /repo/ops/.gitleaksignore \
            --log-opts="--no-merges $RANGE" --redact --no-banner

      # **워크스페이스가 실재해야 부팅한다** — 없으면 config가 던지고 프로세스가 죽는다.
      # docker가 대신 만들게 두면 root 소유가 되어 컨테이너가 쓰지 못한다.
      #
      # `--wait`는 compose의 HEALTHCHECK(`/api/health`)가 통과할 때까지 기다린다.
      # "빌드는 되는데 뜨지 않는다"를 병합 전에 잡는 것이 이 단계의 전부다.
      # 프로젝트 이름은 `.env.ci`의 `ARKA_NAME`이 정한다(`ci`). 터널은 프로필 뒤라 뜨지 않는다.
      - name: 컨테이너가 뜨는가
        run: |
          mkdir -p /tmp/arka-ci-workspace
          ARKA_UID=$(id -u) ARKA_GID=$(id -g) docker compose \
            -f ops/deploy/compose.yml --env-file ops/deploy/.env.ci \
            up -d --build --wait
      - name: 컨테이너가 안 뜨면 로그를 남긴다
        if: failure()
        run: docker compose -f ops/deploy/compose.yml --env-file ops/deploy/.env.ci logs
      - name: 컨테이너를 치운다
        if: always()
        run: docker compose -f ops/deploy/compose.yml --env-file ops/deploy/.env.ci down -v

      # 스펙이 `projects`를 선언하지 않아 기본 chromium으로 돈다. 그것만 받는다.
      # webServer가 스스로 client를 빌드하고 server를 tsx로 띄운다(playwright.config.ts).
      - run: pnpm --filter client exec playwright install --with-deps chromium
      - run: pnpm --filter client run test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: packages/client/.output/playwright/
          retention-days: 7

  deploy:
    name: deploy
    # **검사가 통과한 뒤에만 배포한다.** `needs`만이 워크플로 안에서 그것을 보장한다.
    needs: [check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, arka]
    concurrency:
      group: deploy-production
      # **배포는 중간에 자르지 않는다.** 컨테이너를 바꾸는 중에 끊기면 무엇이 떠 있는지 모른다.
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      # 되돌릴 자리를 먼저 만든다. 지금 떠 있는 이미지에 이름을 붙여 둔다.
      - name: 되돌릴 이미지를 표시한다
        run: docker image tag arka:latest arka:previous 2>/dev/null || echo "첫 배포 — 되돌릴 것이 없습니다"

      - name: 이미지를 만든다
        run: node ops/deploy/build.ts arka:latest

      # **개명 전 컨테이너를 먼저 걷는다.** 이름이 `ade-*`에서 `arka-*`로 바뀌어 compose가
      # 옛 것을 자기 것으로 보지 못한다. 남겨 두면 같은 터널에 둘이 붙고 같은 SQLite를 둘이 쓴다.
      # 첫 배포가 성공하면 이 단계를 지운다.
      - name: 개명 전 컨테이너를 걷는다
        run: docker rm -f ade-app ade-tunnel 2>/dev/null || true

      # 값은 **이 기계의 파일**에 있다(0600) — GitHub Secrets에 두지 않는다. `set -a`로 셸에 풀어
      # compose의 치환(`${ARKA_*}`)과 `environment:` 통과에 둘 다 닿게 한다.
      - name: 올린다
        run: |
          set -a; . "$HOME/ARKA/secure/env/arka.env"; set +a
          docker compose -f ops/deploy/compose.yml --profile tunnel up -d --no-build --wait

      # **이 검사가 실질적인 자물쇠다.** ARKA에는 인증이 없고 워크스페이스가 사용자의 개인
      # 디렉터리라, Access가 살아 있지 않으면 그 전체가 인터넷에 열린다.
      # 오리진도 이 기계의 파일에서 읽는다 — 공개 저장소라 워크플로 로그도 공개다.
      - name: 익명 접근이 막히는지 본다
        run: |
          set -a; . "$HOME/ARKA/secure/env/arka.env"; set +a
          node ops/deploy/anonSmoke.ts "$ARKA_ORIGIN"

      - name: 실패하면 로그와 되돌리는 법을 남긴다
        if: failure()
        run: |
          docker logs --tail 100 arka-app || true
          echo "::error::되돌리려면 docs/operations.md의 '되돌리기' — 이미지를 arka:previous로 되돌리고 같은 compose 명령을 다시 돌립니다"
