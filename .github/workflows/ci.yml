# 타입체크 → 린트 → 테스트 → 빌드. 앞에서 걸리면 뒤를 안 돌린다(USER_NOTE §12).
# 로컬의 `pnpm run check`와 같은 것을 돌린다 — CI에만 있는 검사를 만들지 않는다.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # 버전은 package.json의 packageManager가 정한다
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm --filter client build
      - run: pnpm --filter client build-storybook
        # 깨진 스토리를 잡는다(ADR 0008). VRT가 같은 빌드를 다시 만든다.

  e2e:
    name: e2e (Playwright)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm --filter client test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: packages/client/.output/playwright/
          retention-days: 7

  vrt:
    name: VRT (Docker)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 로컬과 같은 스크립트, 같은 이미지 — 기준 이미지가 기계마다 달라지지 않는 이유가 그것이다.
      - run: pnpm run vrt
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: vrt-report
          path: .output/vrt/
          retention-days: 7

  docker:
    name: Docker 경계 스모크
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      # 볼륨 UID/GID·bind mount inotify·재시작 유지 — 컨테이너 경계에서만 깨지는 셋.
      - run: bash deploy/smoke.sh
