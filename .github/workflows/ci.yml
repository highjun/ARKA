name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/arka:${{ github.sha }}
      LATEST: ghcr.io/${{ github.repository_owner }}/arka:latest
      ARKA_NAME: ci
      ARKA_WORKSPACE: /tmp/arka-ci-workspace
      NODE_ENV: production
      ARKA_CONTAINER_HOST: 0.0.0.0
      ARKA_CONTAINER_PORT: "3000"
      ARKA_CONTAINER_WORKSPACE: /workspace
      ARKA_CLIENT_ROOT: /app/dist/client
      ARKA_TUNNEL_CONFIG: /dev/null
      ARKA_TUNNEL_CREDENTIALS: /dev/null
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

      - name: 이번에 더해진 커밋에 시크릿이 있나
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            RANGE="${{ github.event.before }}..${{ github.sha }}"
          fi
          echo "범위=$RANGE"
          docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.30.1 \
            git /repo --log-opts="--no-merges $RANGE" --redact --no-banner

      - name: 이미지를 굽는다
        run: node ops/deploy/build.ts "$IMAGE"

      - name: 그 이미지가 뜨는가
        run: |
          mkdir -p "$ARKA_WORKSPACE"
          ARKA_UID=$(id -u) ARKA_GID=$(id -g) ARKA_IMAGE="$IMAGE" \
            docker compose -f ops/deploy/compose.yml up -d --no-build --wait
      - name: 안 뜨면 로그를 남긴다
        if: failure()
        run: docker compose -f ops/deploy/compose.yml logs
      - name: 컨테이너를 치운다
        if: always()
        run: docker compose -f ops/deploy/compose.yml down -v

      - name: 검사한 그 이미지를 올린다
        if: github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push "$IMAGE"
          docker tag "$IMAGE" "$LATEST" && docker push "$LATEST"

      - run: pnpm --filter client exec playwright install --with-deps chromium
      - run: pnpm --filter client run test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: packages/client/.output/playwright/
          retention-days: 7

  deploy:
    name: deploy
    needs: [check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, arka]
    environment: production
    permissions:
      contents: read
      packages: read
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/arka:${{ github.sha }}
      ARKA_SECURE: ${{ vars.ARKA_SECURE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 값이 있는지 먼저 본다
        run: test -r "$ARKA_SECURE/.env" || { echo "::error::ARKA_SECURE가 가리키는 .env가 없습니다 — 환경 변수 ARKA_SECURE를 이 기계의 ops/secure 경로로 두세요"; exit 1; }

      - name: 검사한 이미지를 당긴다
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker pull "$IMAGE"

      - name: 올린다
        run: |
          set -a; . "$ARKA_SECURE/.env"; set +a
          ARKA_IMAGE="$IMAGE" docker compose -f ops/deploy/compose.yml --profile tunnel up -d --no-build --wait

      - name: 익명 접근이 막히는지 본다
        run: |
          set -a; . "$ARKA_SECURE/.env"; set +a
          node ops/smoke/anon.ts "$ARKA_ORIGIN"

      - name: 안 쓰는 이미지를 걷는다
        if: always()
        run: docker image prune -f

      - name: 실패하면 로그와 되돌리는 법을 남긴다
        if: failure()
        run: |
          docker logs --tail 100 arka-app || true
          echo "::error::되돌리려면 옛 커밋 SHA 태그를 당겨 같은 compose 명령을 돌립니다"
