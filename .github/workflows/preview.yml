# PR마다 미리보기를 올리고, 닫히면 내린다(→ ADR 0005).
#
# **이 워크플로만 사내 기계에서 돈다.** 그 기계에는 실배포와 사용자의 개인 디렉터리가 있으므로
# 아래 포크 가드가 유일한 방어선이다 — 지우면 남의 코드가 그 기계에서 실행된다.
name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preview:
    name: preview
    # **포크에서 온 코드는 이 기계에서 돌리지 않는다.** 같은 저장소의 브랜치만 지나간다.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, arka]
    permissions:
      contents: read
      pull-requests: write
    env:
      PR: ${{ github.event.pull_request.number }}
      PREVIEW_DOMAIN: ${{ vars.PREVIEW_DOMAIN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 값을 정한다
        id: id
        run: |
          echo "name=pr-$PR" >> "$GITHUB_OUTPUT"
          echo "host=pr-$PR-arka.$PREVIEW_DOMAIN" >> "$GITHUB_OUTPUT"
          echo "workspace=$HOME/.local/state/ade/preview/pr-$PR/workspace" >> "$GITHUB_OUTPUT"

      - name: 닫힌 PR을 내린다
        if: github.event.action == 'closed'
        run: |
          # 미리보기는 호스트 이름이 다시 쓰이지 않으므로 Access 앱까지 지운다 —
          # 실배포와 반대 판단이다(거기서는 남겨야 다음 배포까지 무방비가 되지 않는다).
          node ops/deploy/cli.ts down "${{ steps.id.outputs.name }}" --purge --remove-access
          rm -rf "$(dirname "${{ steps.id.outputs.workspace }}")"

      - name: 동시에 떠 있는 수를 센다
        if: github.event.action != 'closed'
        run: |
          LIVE=$(docker compose ls --format json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).filter(p=>p.Name.startsWith("pr-")).length))')
          echo "지금 $LIVE개 (상한 ${{ vars.PREVIEW_MAX }})"
          if [ "$LIVE" -ge "${{ vars.PREVIEW_MAX }}" ]; then
            echo "::error::미리보기가 상한(${{ vars.PREVIEW_MAX }})에 찼습니다. 오래된 PR을 닫아 주세요."
            exit 1
          fi

      - name: 워크스페이스를 이 PR의 체크아웃으로 채운다
        if: github.event.action != 'closed'
        run: |
          # `.git`을 포함한다 — 소스 제어 탭이 실제로 동작해야 미리보기의 값이 산다.
          rm -rf "${{ steps.id.outputs.workspace }}"
          mkdir -p "${{ steps.id.outputs.workspace }}"
          tar -c --exclude=node_modules --exclude=.output . | tar -x -C "${{ steps.id.outputs.workspace }}"

      - name: 이미지를 만든다
        if: github.event.action != 'closed'
        # `build.ts`를 통한다 — 회수 단계를 비껴가면 미리보기가 돌 때마다 이미지가 쌓인다.
        run: node ops/deploy/build.ts "ade:${{ steps.id.outputs.name }}"

      - name: 올린다
        if: github.event.action != 'closed'
        env:
          ADE_PREVIEW_PR: ${{ github.event.pull_request.number }}
          ADE_PREVIEW_WORKSPACE: ${{ steps.id.outputs.workspace }}
        run: node ops/deploy/cli.ts up ops/deploy/preview.deploy.ts

      - name: 실패하면 로그를 남긴다
        if: failure() && github.event.action != 'closed'
        run: docker logs --tail 100 "${{ steps.id.outputs.name }}-app" || true

      - name: PR에 알린다
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const closed = context.payload.action === 'closed';
            const host = '${{ steps.id.outputs.host }}';
            const state = closed ? '종료됨' : (process.env.JOB_STATUS === 'success' ? '떴습니다' : '실패');
            const body = [
              '<!-- ade-preview -->',
              `### 미리보기 — ${state}`,
              closed ? '이 PR의 미리보기를 내렸습니다.' : `https://${host}`,
              '',
              `커밋 \`${context.payload.pull_request.head.sha.slice(0, 7)}\``,
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const list = await github.rest.issues.listComments({ owner, repo, issue_number });
            const mine = list.data.find((c) => c.body?.includes('<!-- ade-preview -->'));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
        env:
          JOB_STATUS: ${{ job.status }}
