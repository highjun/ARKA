name: PR

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      pull-requests: write
      statuses: write
    env:
      ARKA_IMAGE: ghcr.io/${{ github.repository_owner }}/arka:pr-${{ github.event.pull_request.number }}
      ARKA_NAME: ci
      ARKA_WORKSPACE: ${{ github.workspace }}/packages/client/test/e2e/fixture
      ARKA_PUBLISH: 127.0.0.1:3000
      ARKA_E2E_ORIGIN: http://127.0.0.1:3000
      ARKA_GIT_SHA: ${{ github.sha }}
      NODE_ENV: production
      ARKA_CONTAINER_HOST: 0.0.0.0
      ARKA_CONTAINER_PORT: "3000"
      ARKA_CONTAINER_WORKSPACE: /workspace
      ARKA_CLIENT_ROOT: /app/dist/client
      ARKA_TUNNEL_CONFIG: /dev/null
      ARKA_TUNNEL_CREDENTIALS: /dev/null
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup

      - name: compose가 읽을 나머지 값을 채운다
        run: |
          {
            echo "ARKA_UID=$(id -u)"
            echo "ARKA_GID=$(id -g)"
          } >> "$GITHUB_ENV"

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

      - name: 이번에 더해진 커밋에 시크릿이 있나
        run: |
          docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.30.1 \
            git /repo --redact --no-banner \
            --log-opts="--no-merges ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

      - name: 이미지를 굽고 올린다
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          DOCKER_BUILDKIT=1 docker build -f ops/deploy/Dockerfile -t "$ARKA_IMAGE" .
          docker push "$ARKA_IMAGE"

      - name: 그 이미지를 띄운다
        run: docker compose -f ops/deploy/compose.yml up -d --no-build --wait

      - run: pnpm --filter client exec playwright install --with-deps chromium
      - run: pnpm --filter client run test:e2e

      - name: 안 뜨거나 깨지면 로그를 남긴다
        if: failure()
        run: docker compose -f ops/deploy/compose.yml logs
      - name: 컨테이너를 치운다
        if: always()
        run: docker compose -f ops/deploy/compose.yml down -v

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: packages/client/.output/playwright/
          retention-days: 7

      - name: 그림이 승인된 것과 같은가
        run: pnpm --filter client run test:visual-regression
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: vrt-report
          path: .output/vrt/
          retention-days: 7

      - name: 사용자 검토가 필요한지 본다
        id: review
        run: |
          node ops/needsReview.ts \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}" \
            .output/vrt/ui.md > "$RUNNER_TEMP/review.md"
          if [ -s "$RUNNER_TEMP/review.md" ]; then
            echo "state=pending" >> "$GITHUB_OUTPUT"
            echo "description=검토 필요" >> "$GITHUB_OUTPUT"
          else
            echo "state=success" >> "$GITHUB_OUTPUT"
            echo "description=검토 필요 없음" >> "$GITHUB_OUTPUT"
            echo "## 사용자 검토가 필요 없습니다" > "$RUNNER_TEMP/review.md"
          fi

      - name: 판정을 PR에 적는다
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MARKER: <!-- arka:review -->
          ISSUE: repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments
        run: |
          printf '%s\n%s\n' "$MARKER" "$(cat "$RUNNER_TEMP/review.md")" > "$RUNNER_TEMP/comment.md"
          id=$(gh api "$ISSUE" --paginate --jq "[.[] | select(.body | startswith(\"$MARKER\"))] | .[0].id // empty")
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/${{ github.repository }}/issues/comments/$id" -F body=@"$RUNNER_TEMP/comment.md"
          else
            gh api --method POST "$ISSUE" -F body=@"$RUNNER_TEMP/comment.md"
          fi

      - name: review 상태를 올린다
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method POST "repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha }}" \
            -f state="${{ steps.review.outputs.state }}" \
            -f context=review \
            -f description="${{ steps.review.outputs.description }}" \
            -f target_url="${{ github.event.pull_request.html_url }}"

      - name: 초록이 되면 알아서 들어가게 둔다
        env:
          GH_TOKEN: ${{ secrets.ARKA_MERGE_TOKEN }}
        run: gh pr merge "${{ github.event.pull_request.number }}" --auto --squash --repo "${{ github.repository }}"
