name: PR

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      ARKA_IMAGE: ghcr.io/${{ github.repository_owner }}/arka:pr-${{ github.event.pull_request.number }}
      ARKA_NAME: ci
      ARKA_WORKSPACE: ${{ github.workspace }}/packages/client/test/e2e/fixture
      ARKA_PUBLISH: 127.0.0.1:3000
      ARKA_E2E_ORIGIN: http://127.0.0.1:3000
      ARKA_GIT_SHA: ${{ github.sha }}
      NODE_ENV: production
      ARKA_CONTAINER_HOST: 0.0.0.0
      ARKA_CONTAINER_PORT: "3000"
      ARKA_CONTAINER_WORKSPACE: /workspace
      ARKA_CLIENT_ROOT: /app/dist/client
      ARKA_TUNNEL_CONFIG: /dev/null
      ARKA_TUNNEL_CREDENTIALS: /dev/null
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup

      - name: compose가 읽을 나머지 값을 채운다
        run: |
          {
            echo "ARKA_UID=$(id -u)"
            echo "ARKA_GID=$(id -g)"
          } >> "$GITHUB_ENV"

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

      - name: 이번에 더해진 커밋에 시크릿이 있나
        run: |
          docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.30.1 \
            git /repo --redact --no-banner \
            --log-opts="--no-merges ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

      - name: 이미지를 굽고 올린다
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          DOCKER_BUILDKIT=1 docker build -f ops/deploy/Dockerfile -t "$ARKA_IMAGE" .
          docker push "$ARKA_IMAGE"

      - name: 그 이미지를 띄운다
        run: docker compose -f ops/deploy/compose.yml up -d --no-build --wait

      - run: pnpm --filter client exec playwright install --with-deps chromium
      - run: pnpm --filter client run test:e2e

      - name: 안 뜨거나 깨지면 로그를 남긴다
        if: failure()
        run: docker compose -f ops/deploy/compose.yml logs
      - name: 컨테이너를 치운다
        if: always()
        run: docker compose -f ops/deploy/compose.yml down -v

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: packages/client/.output/playwright/
          retention-days: 7
